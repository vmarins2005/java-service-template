spring:
  application:
    name: template-servico
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/tarifas}
    username: ${JDBC_USER:tarifas}
    password: ${JDBC_PASSWORD:tarifas}
  jpa:
    open-in-view: false          # ver ADR 0004
    hibernate:
      ddl-auto: validate         # quem cria tabela é o Flyway, e só ele
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true            # /health/liveness e /health/readiness
      show-details: when-authorized
  info:
    env:
      enabled: true

server:
  shutdown: graceful             # ver ADR 0004

logging:
  level:
    root: INFO
